# ==============================================================================
# Подкраска ЛИНИЙ СВЯЗНОСТИ по загрузке интерфейса (%)
# Панель FLOW (andrewbmchugh-flow-panel). Схема: core-2-flow.svg
# Datasource: Prometheus + snmp_exporter
#
# cellIdPreamble = "cell-" — панель ищет в SVG элементы с id="cell-<ключ>".
# Каждая запись в cells — ОДНА линия связи на схеме (ячейка draw.io).
# dataRef = имя time-series ровно в том виде, в котором его отдаёт Grafana,
#   т.е. значение legendFormat у запроса. По умолчанию принято "lk<cell_id>",
#   например lk263 — задайте legendFormat: lk263 у соответствующего запроса.
#   Если удобнее свои имена (ifAlias, ifName и т.п.) — впишите их в
#   flow/link-map.csv (колонка your_prometheus_series) и перезапустите
#   tools/build_flow.py либо просто замените dataRef в этом файле.
#
# Пороги берутся из siteConfig -> thresholds.linkUtil (0/70/85/95 %).
# PromQL (snmp_exporter), legendFormat = <dataRef>, например lk263:
#   100 * 8 * rate(ifHCInOctets{ifIndex="42",instance="msk70"}[$__rate_interval])
#     / (ifHighSpeed{ifIndex="42",instance="msk70"} * 1e6)

# ==============================================================================

cellIdPreamble: "cell-"

# none = цвет переключается ступенькой на пороге; hue = плавный градиент
gradientMode: "none"

# last = последняя точка окна; lastNotNull = последняя непустая (устойчивее)
datapoint: "lastNotNull"

cellLabelDecimalPoints: 1

cells:

